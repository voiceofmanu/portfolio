<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none">
    <rect width="600" height="360" rx="16" fill="#0d0f14"/>
    <rect x="1" y="1" width="598" height="358" rx="15" stroke="url(#borderGrad2)" stroke-width="2"/>
    <!-- Funnel / Matrix visual -->
    <g transform="translate(60, 160)">
        <rect x="0" y="50" width="100" height="100" rx="8" fill="#181b22" stroke="#ff5e14" stroke-width="1.5"/>
        <text x="25" y="105" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Meta</text>
        <path d="M110 100H150" stroke="#ff7a00" stroke-width="2" stroke-dasharray="4 4"/>
        <rect x="160" y="30" width="130" height="120" rx="8" fill="#1e222d" stroke="#ff7a00" stroke-width="1.5"/>
        <text x="180" y="90" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#ff7a00">Advantage+</text>
        <text x="180" y="112" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#d1d5db">Broad Audiences</text>
        <path d="M300 90H340" stroke="#ff7a00" stroke-width="2" stroke-dasharray="4 4"/>
        <rect x="350" y="10" width="130" height="140" rx="8" fill="url(#scaleGrad)"/>
        <text x="380" y="70" font-family="'Poppins', sans-serif" font-weight="800" font-size="26" fill="#ffffff">4.8x</text>
        <text x="380" y="95" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff">ROAS Scaled</text>
    </g>
    <!-- Floating Badge -->
    <rect x="40" y="40" width="160" height="36" rx="18" fill="#181b22" stroke="#ff5e14" stroke-width="1.2"/>
    <circle cx="58" cy="58" r="5" fill="#ff5e14"/>
    <text x="74" y="63" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#ffffff" letter-spacing="0.5">META ADS MASTERY</text>
    <!-- Metric Pill -->
    <rect x="380" y="40" width="180" height="36" rx="18" fill="#ff5e14" fill-opacity="0.18" stroke="#ff7a00" stroke-width="1.2"/>
    <text x="405" y="63" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#ff7a00">-34% CPA LOWER</text>
    <!-- Headline overlay inside graphic -->
    <text x="40" y="120" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#ffffff">Advantage+ &amp; Broad Audiences</text>
    <text x="40" y="145" font-family="'Poppins', sans-serif" font-weight="400" font-size="13" fill="#a0aec0">Why Micro-Targeting Kills Your Ad Return</text>
    <defs>
        <linearGradient id="scaleGrad" x1="0" y1="0" x2="130" y2="140" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff7a00"/>
            <stop offset="1" stop-color="#e04a05"/>
        </linearGradient>
        <linearGradient id="borderGrad2" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff7a00" stop-opacity="0.4"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
</svg>
